name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate source and version consistency
        run: npm run validate
      - name: Require SemVer increment
        if: github.event_name == 'pull_request'
        run: bash scripts/check-version.sh --base "${{ github.event.pull_request.base.sha }}"
